# Configuración de análisis SonarQube - CuidartePlus
sonar.projectKey=cuidarteplus
sonar.projectName=CuidartePlus
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Código fuente (backend Express + frontend React)
sonar.sources=BACKEND/src,FRONTEND/src,BACKEND/sql,BACKEND/Dockerfile,FRONTEND/Dockerfile,docker-compose.yml
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/uploads/**,**/coverage/**,**/*.min.js,**/assets/**

# Pruebas automatizadas (Jest en el backend, Vitest en el frontend)
sonar.tests=BACKEND/tests,FRONTEND/tests
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

# Cobertura: sonar-scan.sh genera estos lcov con rutas relativas a la raíz del proyecto
sonar.javascript.lcov.reportPaths=BACKEND/coverage/lcov.sonar.info,FRONTEND/coverage/lcov.sonar.info
# Las pruebas de integración/rendimiento requieren Docker y no aportan cobertura
sonar.coverage.exclusions=BACKEND/sql/**,**/Dockerfile,docker-compose.yml

# El proyecto no es un repositorio git
sonar.scm.disabled=true
