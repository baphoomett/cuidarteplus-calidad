# =====================================================================
# Pipeline de calidad de Cuidarte Plus (Integracion Continua)
# =====================================================================
name: Calidad Cuidarte Plus

# Disparadores: push a main/develop, Pull Request hacia main o ejecucion manual.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permisos minimos; el job de publicacion solicita packages: write.
permissions:
  contents: read

# Cada job corre en un runner limpio. "needs" define el orden entre etapas.
jobs:
  # ETAPA 1 · Revisiones rapidas, ejecutadas en paralelo.
  secretos:
    name: 1a · Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Revisar todo el historial, no solo el commit actual.

      - name: Descargar Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz gitleaks

      - name: Buscar contraseñas y claves expuestas
        run: ./gitleaks git . --redact -v

  dockerfiles:
    name: 1b · Dockerfiles (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar Dockerfile del backend
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: BACKEND/Dockerfile

      - name: Revisar Dockerfile del frontend
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: FRONTEND/Dockerfile

  # ETAPA 2 · Pruebas del backend y analisis estatico.
  pruebas-codigo:
    name: 2 · Unitarias + Integración (Jest) y SonarQube
    # Esta etapa comienza solo si Gitleaks y Hadolint aprobaron.
    needs: [secretos, dockerfiles]
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_DB: cuidarteplus
      JWT_SECRET: ci-test-cuidarteplus-jwt-secret-with-enough-length
      PORT_POSTGRES: 15442
      PORT_BACKEND: 4444

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Encender la base de datos de pruebas
        run: docker compose up -d --wait cuidarteplus-postgres-ev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: BACKEND
        run: npm ci --ignore-scripts

      - name: Ejecutar pruebas unitarias, funcionales y de seguridad
        working-directory: BACKEND
        run: npm test -- --runInBand

      - name: Encender la API para pruebas de integración
        run: docker compose up -d --wait cuidarteplus-backend-ev

      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4444/ > /dev/null && exit 0
            sleep 2
          done
          docker compose logs cuidarteplus-backend-ev
          echo "La API no respondió a tiempo"
          exit 1

      - name: Ejecutar pruebas de integración
        working-directory: BACKEND
        run: npm run test:integration

      - name: Guardar reporte de cobertura
        # Guardar cobertura incluso si alguna prueba falla.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: BACKEND/coverage/

      - name: Ajustar rutas de cobertura para SonarQube
        # Jest genera rutas relativas a BACKEND; el analisis desde la raiz necesita el prefijo.
        run: sed -i 's#^SF:#SF:BACKEND/#' BACKEND/coverage/lcov.info

      - name: Análisis SonarQube Cloud y Quality Gate
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Esperar el resultado de la Quality Gate y fallar si no se cumple.
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Apagar la base de datos
        # Limpiar el servicio incluso si una prueba o el analisis falla.
        if: always()
        run: docker compose down -v

  # ETAPA 3 · Pruebas con el sistema completo encendido.
  pruebas-sistema:
    name: 3 · Sistema, aceptación, rendimiento y seguridad
    # Solo comienza cuando terminan correctamente las pruebas de codigo y SonarQube.
    needs: [pruebas-codigo]
    runs-on: ubuntu-24.04
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_DB: cuidarteplus
      JWT_SECRET: ci-test-cuidarteplus-jwt-secret-with-enough-length
      PORT_POSTGRES: 15442
      PORT_BACKEND: 4444
      PORT_FRONTEND: 3333
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - name: Construir y encender Cuidarte Plus
        run: docker compose up -d --build --wait

      - name: Esperar a que el frontend responda
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3333 > /dev/null && exit 0
            sleep 2
          done
          echo "El frontend no respondió a tiempo"
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        working-directory: pruebas-e2e
        run: |
          npm ci --include=dev --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Pruebas de sistema, aceptación y accesibilidad
        working-directory: pruebas-e2e
        run: ./node_modules/.bin/playwright test

      - name: Guardar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: pruebas-e2e/playwright-report/

      - name: Prueba de rendimiento (perfil humo)
        # En el runner Linux, --network host permite usar localhost desde el contenedor k6.
        run: |
          docker run --rm --network host \
            -v "$PWD/pruebas-rendimiento:/scripts" \
            grafana/k6:1.3.0 run -e PERFIL=humo -e BASE_URL=http://localhost:4444 /scripts/carga.js

      - name: Escaneo de seguridad ZAP (web y API)
        # -I ignora WARN; los hallazgos FAIL siguen haciendo fallar el escaneo.
        if: always()
        run: |
          mkdir -p zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3333 -r zap-web.html -I
          docker run --rm --network host \
            -v "$PWD/zap:/zap/wrk:rw" \
            -v "$PWD/BACKEND/src/openapi.json:/tmp/openapi.json:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t /tmp/openapi.json -f openapi -O http://localhost:4444 -r zap-api.html -I

      - name: Guardar reportes de ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-zap
          path: zap/

      - name: Apagar Cuidarte Plus
        # Apagar y eliminar los contenedores aunque falle una prueba.
        if: always()
        run: docker compose down -v

  # ETAPA 4 · Entrega continua: publicar imagenes solo desde main
  # y unicamente despues de que todas las etapas anteriores hayan aprobado.
  publicar:
    name: 4 · Publicar imágenes Docker (GHCR)
    needs: [pruebas-sistema]
    # No publicar desde Pull Requests, ejecuciones manuales ni otras ramas.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Preparar nombre del dueño en minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN lo genera GitHub; no se guarda como secreto manual.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./BACKEND
          push: true
          # latest identifica la version reciente; github.sha permite rastrear el commit.
          tags: |
            ghcr.io/${{ env.OWNER }}/cuidarteplus-backend:latest
            ghcr.io/${{ env.OWNER }}/cuidarteplus-backend:${{ github.sha }}

      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./FRONTEND
          push: true
          build-args: |
            VITE_API_URL=http://localhost:4444
          # Las etiquetas permiten identificar la version y rastrear su commit.
          tags: |
            ghcr.io/${{ env.OWNER }}/cuidarteplus-frontend:latest
            ghcr.io/${{ env.OWNER }}/cuidarteplus-frontend:${{ github.sha }}